# 每天发现一次社区平台包：搜索打了 databridge-pack 标签的公开仓库，校验后写进 index.json 的 community。
# 只读 GitHub（搜索、Release、文件），不上传任何东西；索引有变化才提交。
name: discover
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 发现社区包并重新生成索引
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_index.py --discover
      - name: 索引有变化就提交
        run: |
          if git diff --quiet index.json; then echo "社区包没有变化"; exit 0; fi
          git config user.name "databridge-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "chore: 更新社区包索引"
          git push
